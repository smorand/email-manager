version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic
    - revive
    - unconvert
    - gosec

  settings:
    gosec:
      excludes:
        # G304: file inclusion via variable; expected for a CLI that reads
        # paths supplied by the user.
        - G304
    revive:
      rules:
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: error-return
        - name: error-strings
        - name: package-comments

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
